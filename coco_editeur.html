function getReferenceValue(ref) {
  const baseAlphaValue = 100000; // Valeur de base pour les chaînes alphabétiques
  const baseNumValue = 100; // Valeur de base pour les chaînes numérique
  const baseprime = 1;
  const isNumeric = str => /^\d+$/.test(str);
  const isAlpha = str => /^[a-zA-Z]+$/.test(str);
  const isNumAlpha = str => /^\d+[_a-zA-Z]+$/.test(str);
  const isAlphaNum = str => /^[a-zA-Z]+[_\d]+$/.test(str);
  var valeur = 0;
  var listeapostrophes = [];
  
  var listeavantapostrophes = ref.match(/[^']+/);
 // alert(ref+" avant =>"+listeavantapostrophes);
  var avantapostrophes = listeavantapostrophes[0];

  if (isNumeric(avantapostrophes)) {
    valeur = parseInt(ref, 10) * baseNumValue;
  }

  if (isAlpha(avantapostrophes)) {
    // Calculer une valeur basée sur les lettres (ex: A=1, B=2, ..., Z=26)
    let value = 0;
    for (let i = 0; i < ref.length; i++) {
      value += (ref.charCodeAt(i) - 64); // A=65 en ASCII → A=1
    }
    valeur = baseAlphaValue + value * baseNumValue;
  }

  // Cas mixte : lettres + chiffres
  if (isNumAlpha(avantapostrophes)) {
    const match = avantapostrophes.match(/^(\d+)(?:_?)([a-zA-Z]+)/);
    const letters = match[2];
    const digits = match[1];
    let letterValue = 0;
    for (let i = 0; i < letters.length; i++) {
      letterValue += (letters.charCodeAt(i) - 64);
    }
  valeur = (parseInt(digits, 10) || 0) * baseNumValue + letterValue;

  }

  if (isAlphaNum(avantapostrophes)) {
    const match = avantapostrophes.match(/^([a-zA-Z]+)(?:_?)([\d]+)/);
    const letters = match[1];
    const digits = match[2];
    let letterValue = 0;
    for (let i = 0; i < letters.length; i++) {
      letterValue += (letters.charCodeAt(i) - 64);
    }
  valeur = baseAlphaValue + letterValue * baseNumValue + (parseInt(digits, 10) || 0);
  }
  
  listeapostrophes = ref.match(/'+/);
  if (listeapostrophes) {
    var nombreapostrophes = listeapostrophes[0].length;
 //   alert(ref+" nb apost =>"+nombreapostrophes);
	valeur += nombreapostrophes*baseprime;
  }
  return valeur;

}

function OrdonnerBalises(balises, fonction, decroissant) {
	var reponse = [];
	var balises_pour_indice = [];
	var maxi = 0;
	var valeur = 0;
	for (var i=0; i<balises.length; i++) {
		eval('valeur = '+fonction+'(balises[i]);');
		if (valeur > maxi) maxi = valeur;
	}

	for (var i=0; i<=maxi; i++) balises_pour_indice[i] = [];

	for (var i=0; i<balises.length; i++) {
		eval('valeur = '+fonction+'(balises[i]);');
		try {
			balises_pour_indice[valeur].push(balises[i]);
		}
		catch(err) {
			alert('balise:'+balises[i].idobjet+' '+balises[i].valeur+': ERREUR pour la valeur '+valeur+' avec la fonction '+fonction);
		}
	}

	if (decroissant) {
		for (var i=maxi; i>0; i--) {
			try {
				for (var j=0; j<balises_pour_indice[i].length; j++) reponse.push(balises_pour_indice[i][j]);
			}
			catch(err) { alert('panne');}
		}
	}
	else {
		for (var i=1; i<=maxi; i++) {
			try {
				for (var j=0; j<balises_pour_indice[i].length; j++) reponse.push(balises_pour_indice[i][j]);
			}
			catch(err) { alert('panne');}
		}
	}
	return reponse;
}

function Numerote_paragraphes(texte, inclure_numpar) {
	if (! inclure_numpar) return texte;
	var emplacement = 0;
	emplacement = texte.search(/___num_par___/);
	while(emplacement!=-1) {
		numero_de_paragraphe += 1;
		var str = "" + numero_de_paragraphe;
		var pad = "0000"
		var chaine = "[" + pad.substring(0, pad.length - str.length) + str + "] ";
		texte = texte.substring(0, emplacement) + chaine + texte.substring(emplacement+13);
		emplacement = texte.search(/___num_par___/);
	}
	return texte;
}

function Reordonne_references(texte) {

	else {
		var motifrecherche = "<" + commande_reordonner_references + "='([^'\\/>]*)'\\/>";
		var patt = new RegExp(motifrecherche, 'igm');
		texte_de_travail = texte.replace(patt, '');

		if (reponse.length>1) if (reponse[1]==parseInt(reponse[1])) limite = parseInt(reponse[1]);
		return Reordonner_references(texte_de_travail, intervalle, limite);
	}
}

function Reordonner_references(texte, saut, limite) {
	var texte_de_travail = texte;
	var motif_balise_ref_ouvrante = MotifBaliseRefOuvrante();
	var motif_balise_ref_fermante = MotifBaliseRefFermante();
	var liste_balises_reference = liste_balises_de_type(tagname_ref);
	var liste_balises_reference_triees = Balises_par_numero_croissant(liste_balises_reference);
	var increment = 1;
	for (var i=0; i < liste_balises_reference_triees.length; i++) {
//		alert('dernière valeur '+i+':'+liste_balises_reference_triees[i].numero_balise);
		if (ValeurNumeriqueReference(liste_balises_reference_triees[i]) > limite) {
			var patt = new RegExp(motif_balise_ref_ouvrante+FormatRegex(liste_balises_reference_triees[i].expressionreferencee)+motif_balise_ref_fermante, 'ig');
			texte_de_travail = texte_de_travail.replace(patt, '$1'+liste_balises_reference_triees[i].expressionreferencee.replace(new RegExp(NomObjet(liste_balises_reference_triees[i])), limite+(increment*saut)) + motif_balise_ref_fermante);
			increment += 1;

		}
	}
	return texte_de_travail;
}

function Espace_references(texte) {
	var texte_de_travail = '';
	var saut = Personnalisation(commande_espacer_references, texte);
	var limite = 0;
	if (saut == null) { return texte; }
	else { 
		var motifrecherche = "<" + commande_espacer_references + "='([^'\\/>]*)'\\/>";
		var patt = new RegExp(motifrecherche, 'igm');
		texte_de_travail = texte.replace(patt, '');
		var reponse = Decouper(saut);
		if (reponse[0]==parseInt(reponse[0])) intervalle = parseInt(reponse[0]);
		if (reponse.length>1) if (reponse[1]==parseInt(reponse[1])) limite = parseInt(reponse[1]);
		return Espacer_references(texte_de_travail, intervalle, limite);
	}
}

function Espacer_references(texte, saut, limite) {
	var texte_de_travail = texte;
	var motif_balise_ref_ouvrante = MotifBaliseRefOuvrante();
	var motif_balise_ref_fermante = MotifBaliseRefFermante();
	var liste_balises_reference = liste_balises_de_type(tagname_ref);
	var liste_balises_reference_triees = Balises_par_id_croissant(liste_balises_reference);
//	alert('dernière valeur:'+ValeurNumeriqueReference(liste_balises_reference_triees[liste_balises_reference_triees.length-1]));
	var increment = 0
	for (var i=liste_balises_reference_triees.length-1; i>=0; i--) {
//		alert('dernière valeur i:'+ValeurNumeriqueReference(liste_balises_reference_triees[i]));
		var patt = new RegExp(motif_balise_ref_ouvrante+FormatRegex(liste_balises_reference_triees[i].expressionreferencee)+motif_balise_ref_fermante, 'ig');
		texte_de_travail = texte_de_travail.replace(patt, '$1'+liste_balises_reference_triees[i].expressionreferencee.replace(new RegExp(NomObjet(liste_balises_reference_triees[i])), limite+(increment*saut)) + motif_balise_ref_fermante);
		increment += 1;
		if (ValeurNumeriqueReference(liste_balises_reference_triees[i]) <= limite) break;
	}
	return texte_de_travail;
}

function AfficheDescriptionFigures(inclure_numpar) {
	var balises_mdr = liste_balises_mdr();
	var texte_balise_mdr = '';
	var texte_numerote = '';
	var texte = "<p>" + Numero_de_paragraphe_affiche(inclure_numpar) + expression_introduction_figures + "</p>";
	var motif = FormatRegex('_n_');
	var res = '';
	var suite = '';
	var patt = new RegExp('('+motif+')+'+motif+'|^'+motif, 'img');
	var fin = 0;
	var debut = 0;
	var saut = 0;
	var recul = 0;
	var retour = "";
	for (var i=0; i<balises_mdr.length; i++) {
		if (avec_titres && i==1) texte_numerote += "<p class='titre'>" + expression_titre_description_detaillee_figures + "</p><p>"
		texte_balise_mdr = RemplaceRefs(balises_mdr[i].valeur, false, balises_mdr[i].idobjet);
		// si le texte commence par '_n_', on retire ce début
		if (texte_balise_mdr.substring(0,3) == '_n_') saut = 3;
		else saut = 0;
		//if (inclure_numpar) {
		debut = saut;
		while (patt.test(texte_balise_mdr) == true) {
			fin = patt.lastIndex;
			// si le texte contient  '_n__n_', on remplace par un changement de paragraphe
			if (texte_balise_mdr.substring(fin-6, fin) == '_n__n_') {
				recul = 6;
				retour = "</p><p>"
			}
			else {
				recul = 0;
				retour = "";
			}
			texte_numerote += texte_balise_mdr.substring(debut, fin-recul) + retour + Numero_de_paragraphe_affiche(inclure_numpar);
			debut = fin;
		}
		texte_numerote += texte_balise_mdr.substring(fin);
		texte_balise_mdr = texte_numerote;
		texte_numerote = '';
		//}
		texte += "<p>" + texte_balise_mdr + "</p>";
	}
	return texte;
}
