<script type="text/javascript">

function deleteCookie(cname) {
  document.cookie = cname+"=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
}

function setCookie(cname, cvalue, exdays) {
    var d = new Date();
    d.setTime(d.getTime() + (exdays*24*60*60*1000));
    var expires = "expires="+ d.toUTCString();
    document.cookie = cname + "=" + MiseAPlat(cvalue) + "; " + expires + "; path=/";
}

function getCookie(cname) {
    var name = cname + "=";
    var decodedCookie = decodeURIComponent(document.cookie);
    var ca = decodedCookie.split(';');
    for(var i = 0; i <ca.length; i++) {
        var c = ca[i];
        while (c.charAt(0) == ' ') {
            c = c.substring(1);
        }
        if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length).replace(/_n_/g,'\n');
        }
    }
    return "";
}


function setLocally(cname, cvalue) {
  if (typeof(Storage) !== "undefined") {
    try {
      localStorage.setItem("COCO_save"+cname, cvalue);
    }
    catch(err) {
      alert(err.message);
    }
  } 
  else {
    alert("Pas de sauvegarde locale dans ce navigateur")
  }
}


function getLocally(cname) {
  if (typeof(Storage) !== "undefined") {
      try {
        return localStorage.getItem("COCO_save"+cname);
      }
      catch(err) {
        return "";
      }  
  } 
  else {
    alert("Pas de sauvegarde locale dans ce navigateur")
  }
}

function deleteLocally(cname) {
  if (typeof(Storage) !== "undefined") {
    try {
        localStorage.removeItem("COCO_save"+cname);
       }
      catch(err) {
        alert(err.message);
      }
  } 
  else {
    alert("Pas de sauvegarde locale dans ce navigateur")
  }
}

function deleteSauvegardes() {
  var dico = DicoLocalSauf("preferences", "");
  for (var i=0; i<dico.length; i++) {
    localStorage.removeItem("COCO_save"+dico[i]);
  }
}

function DicoLocalSauf(tagname_exclu, message_si_rien) {
    var dico = {};
    for (var i=0; i<localStorage.length; i++) {
//      alert(localStorage.key(i).substring(0, 9));
      if (localStorage.key(i).substring(0, 9) == 'COCO_save') {
        var c = localStorage.key(i).substr(9);
        dico[c] = localStorage.getItem(localStorage.key(i));
      }
    }
    return dico;
}


function DicoCookiesSauf(tagname_exclu, message_si_rien) {
    var decodedCookie = decodeURIComponent(document.cookie);
    var ca = decodedCookie.split(';');
    var dico = {};
    for(var i = 0; i <ca.length; i++) {
        var c = ca[i].trim();
        var longueur_nom = c.indexOf('=');
        var key = c.substring(0, longueur_nom);
        if ((longueur_nom > 0) && (key != tagname_exclu)) dico[key] = c.substr(longueur_nom + 1);
        }
//    if (dico.length == 0) alert(message_si_rien)
//    else for(var key in dico) alert(key+')'+dico[key]);
    return dico;
}

function ListeReferencesSauvegardeHtml() {
  var dico_sources = DicoLocalSauf("preferences", "pas de préférences sauvegardées");
  if (dico_sources.length != 0) {
    var liste_affichee = '<select><option value="none">'+expression_sans_sauvegarde+'</option><option value="new">'+expression_nouvelle_sauvegarde+'</option>';
    var i=0;
    var liste_references = [];
    for (var key in dico_sources) {
      liste_references[i] = key;
      i += 1;
      liste_affichee += '<option value="' + key + '"' + ((key==referencedossier) ? 'selected':'') + '>' + key + ' (' + dico_sources[key].substring(0, 20) + ')</opion>';
    }
    liste_affichee += '</select>';
    return liste_affichee;
  }
  return "";
}


function ChoisirReferenceSauvegarde(message, creer_si_absente) {
  var dico_sources = DicoCookiesSauf("preferences", "pas de préférences sauvegardées");
  if (dico_sources.length != 0) {
  	var liste_affichee = '\n';
    var i=0;
    var liste_references = [];
  	for (var key in dico_sources) {
      liste_references[i] = key;
      i += 1;
      liste_affichee += i + ') ' + key + ':' + dico_sources[key] + '\n';
  	}
  	var indice = prompt(message+liste_affichee);
    if ((indice > 0) && (indice <= liste_references.length)) {
//      alert(liste_references[indice-1] + ' + ' + dico_sources[liste_references[indice-1]])
      return [liste_references[indice-1], dico_sources[liste_references[indice-1]].replace(/_n_/g,'\n')];
    }

    if (creer_si_absente) {
      if (indice == 0) {
        var reference = SaisirNouvelleReference();
        return [reference, ""];
      }
    }
  }
  return ["", ""];
}


function ChargerSourceSauvegarde(reference) {
  if (reference==null) reference = referencedossier;
  else referencedossier = reference;
  var source_recuperee = RecupererSource(reference);
  if ((source_recuperee) != "") window.document.getElementById('cadresource').value = source_recuperee;
  window.document.getElementById('listereferencessauvegarde').innerHTML = ListeReferencesSauvegardeHtml();
}


function ModifieReferenceDossier() {
  var liste = window.document.getElementById('listereferencessauvegarde');
  var valeur_choisie = liste.options[liste.selectedIndex].value;
  var nouvellereferencedossier = '';
  var message_confirmation = '';
  var confirmation = '';
  if (valeur_choisie != null) {
    if (valeur_choisie == "new") {
      nouvellereferencedossier = SaisirNouvelleReference();
    }
    else {
      if (valeur_choisie == "none") {
        nouvellereferencedossier = "none";
      }
      else nouvellereferencedossier = valeur_choisie;
    }

    if (referencedossier != nouvellereferencedossier) {
      if (referencedossier != "none") {
        if (confirm("Sauvegarder "+referencedossier+" ?")) {
          SauverSource(referencedossier);
        }
      }
          
      if ((valeur_choisie != "new") && (nouvellereferencedossier != "none")) {
        if (confirm("Charger "+nouvellereferencedossier+" ?")) {
          ChargerSourceSauvegarde(nouvellereferencedossier);
        }
      }

      if (valeur_choisie == "new") {
        SauverSource(nouvellereferencedossier);
      }

      referencedossier = nouvellereferencedossier;
    }
  }
  window.document.getElementById('referencedossier').value = referencedossier;
  window.document.getElementById('listereferencessauvegarde').innerHTML = ListeReferencesSauvegardeHtml();
}

function SaisirNouvelleReference() {
  var sortir = false;
  while (!sortir) {
    var reference = prompt("Veuillez entrer une référence de dossier (sans espaces) : ");
    if (reference == null) return referencedossier;
    if (reference != "") {
      if (RecupererSource(reference) != "") {
        if (confirm("Cette référence existe déjà. Si vous confirmez, l'ancienne référence sera écrasée à la prochaine sauvegarde. Confirmer ?")) {
          sortir = true;
        }
      }
      else {
        sortir = true;
      }
    }
  }
  return reference;
}

function RecupererSource(reference) {
  var source_recuperee = getLocally(reference);
  if ((source_recuperee != null) && (source_recuperee != "")) return source_recuperee.replace(/_n_/g,'\n');
  else return "";
}

function SauverSourceForce() {
  var reference = referencedossier;
  if (reference == "none") {
    reference = SaisirNouvelleReference();
  }
  SauverSource(reference);
}


function SauverSource(reference) {
  if ((reference != null) && (reference != "") && (reference != "none")) {
    ColoreSauvegarde();
    setLocally(reference, MiseAPlat(window.document.getElementById('cadresource').value));
  }
  window.document.getElementById('listereferencessauvegarde').innerHTML = ListeReferencesSauvegardeHtml();
}


function DetruireSauvegarde(reference) {
  var confirmation = confirm('Détruire la sauvegarde '+reference+' ?');
  if (confirmation) {
    deleteLocally(reference);
  }
}

function DetruireToutesLesSauvegardes(reference) {
  var confirmation = confirm('Détruire toutes les sauvegardes ? \n(opération irréversible)');
  if (confirmation) {
    deleteSauvegardes();
  }
}

function ColoreSauvegarde() {
  //window.document.body.style.backgroundColor = "red";
  window.document.getElementById('cadresource').style.borderColor = "red";
  setTimeout(function() {window.document.getElementById('cadresource').style.borderColor = "white";}, 1000);
}


function Exemple() {
	var texte = '';
	texte += "COnsistent\n" +
	"COnstruction of patent applications\n" +
	"ou\n" +
	"COnstruction\n" +
	"COhérente de demandes de brevets  ...  en bref : COCO\n" +
	"–––––––––––––––––––––––––––––––––––––––––––––––––––––\n" +
	"\n";
	texte += "COCO est un perroquet qui saisit certains morceaux d'un texte et s'en sert pour fabriquer un projet de demande de brevet, par répétition de ces informations dans des phrases à structure prédéfinie.\n\n";
	texte += "Le texte source est tapé dans cette fenêtre. Le projet apparaît dans une autre fenêtre.\n\n"
	texte += "Considérons le texte suivant.\n\n";
	texte += "On décrit une invention que l'on souhaite breveter. Cet objet renferme, comme première caractéristique, une caractéristique connue A.\n" +
"L'invention qui caractérise cet objet réside dans le fait que ledit objet contient aussi :\n" +
"- une caractéristique est A\n" +
"- une caractéristique est B\n" +
"- une caractéristique est C.\n" +
"Ces caractéristiques seront décrites plus en détail.\n" +
"Mais chacune de ces caractéristiques possède des variantes. Ainsi, la caractéristique A peut se décliner en une première option a1.\n" +
"De plus, la caractéristique A possède une deuxième option a2 qui peut se combiner à la première option a1.\n" +
"Mais il existe aussi une alternative à l'option a2 : a2bis. Cette alternative doit donc se combiner avec A et a1, mais pas avec a2.\n" +
"De même, la caractéristique B se décline en une option b1.\n" +
"Et la caractéristique C en une option c1.\n\n";
	texte += "Pour que COCO identifie les morceaux de texte à utiliser pour fabriquer un projet de demande de brevet, on place des balises dans ce texte. Chaque balise respecte le format suivant : \n" +
"<type_balise nom_balise> texte à reconnaître </type_balise>.\n" +
"Les morceaux de texte reconnus par COCO forment son vocabulaire. Ils sont indiqués, pour information, dans une fenêtre à part, avec une numérotation croissante. Cette numérotation est purement indicative.\n\n" +
"Ci-dessous, on a reproduit le texte précédent en y insérant les balises adéquates. Pour bien vous faire comprendre le fonctionnement de COCO, l'écriture des balises ci-dessous est volontairement erronée, pour que COCO ne les reconnaisse pas au premier affichage. Corrigez les balises vous-même (en supprimant le caractère _ qui suit le premier caractère < de chaque balise, et constatez le résultat.\n\n" +
"Le projet de demande de brevet généré par COCO apparaît dans une fenêtre indépendante, dont le contenu est mis à jour automatiquement.\n\n" +
"\nTexte avec balises :\n" + 
"––––––––––––––––––––\n";
	texte += "On décrit une <_objet invention gn='fs'>invention (5)</objet> que l'on souhaite breveter. Cet objet renferme, comme première caractéristique, une <_connu c1 de='objet invention'>caractéristique connue A</connu>.\n" +
"L'invention qui caractérise cet objet réside dans le fait que ledit objet contient aussi :\n" +
"- une caractéristique <_nouveau A de='objet invention'>A</nouveau>\n" +
"- une caractéristique <_nouveau B de='objet invention'>B</nouveau>\n" +
"- une caractéristique <_nouveau C de='objet invention'>C</nouveau>.\n" +
"Ces caractéristiques seront décrites plus en détail.\n" +
"Mais chacune de ces caractéristiques possède des variantes. Ainsi, la caractéristique A peut se décliner en une première option qui<_verbe A de='nouveau A'>est</verbe> <_option a1 de='nouveau A'>a1</option>.\n" +
"De plus, la caractéristique A possède une deuxième option <_option a2 de='nouveau A'>a2</option> qui peut se combiner à la première option a1.\n" +
"Mais il existe aussi une alternative à l'option a2 : <_alternative a2bis de='option a2'>a2bis</alternative>. Cette alternative ne doit donc se combiner qu'avec A et a1, mais pas avec a2.\n" +
"De même, la caractéristique B se décline en une option qui <_verbe B de='nouveau B'>est</verbe><_option b1 de='nouveau B'>b1</option>.\n" +
"Et la caractéristique C en une option qui <_verbe C de='nouveau C'>est</verbe> <_option c1 de='nouveau C'>c1</option>.\n\n";
	texte_exemple = texte;
	texte = "Voyons comment COCO travaille pour vous.\nTout d'abord, COCO réagit à mesure que vous tapez votre texte.\n\n";
	texte += "Pour que COCO identifie les morceaux de texte à utiliser pour fabriquer un projet de demande de brevet, on place des balises dans ce texte. Chaque balise respecte le format suivant : \n" +
"<type_balise nom_balise> texte à reconnaître </type_balise>.\n" +
	"Dépendance des revendications.\n\n" +
"Par défaut, les revendications générées par COCO sont à dépendance multiple, ce qui est le cas le plus fréquent, notamment en droits français et européen. Cependant, si on veut que COCO génère des revendications sans dépendance multiple, il suffit d'ajouter quelque part dans le texte une balise 'dependance', comme suit : .\n" +
"<_dependance='unique'/>  (corrigez l'écriture de la balise en supprimant le caractère _ pour observer l'effet de cette balise)\n" +
"Une dépendance unique autorise des dépendances multiples pour des revendications qui ne dépendent pas déjà de plusieurs revendications. Pour n'avoir aucune dépendance multiple, il faut taper 'unique_seulement' entre les guillements.\n\n";
	texte += "Description des figures.\n\n" +
"COCO reprend in extenso toute votre description placée entre des balises 'mdr' (eh non, cela signifie ici 'mode de réalisation'). Ainsi (corrigez l'écriture de la balise en supprimant le caractère _ pour observer l'effet de cette balise) :\n\n" +
"<_mdr 1>\nSur la figure 1, l'organe de préhension inférieur est représenté de trois quart, ... \nL'organe de préhension inférieur permet ...<_/mdr>.\n\n" +
"Les retours à la ligne sont gérés de cette manière :\n" +
"Un seul = on ne change pas de paragraphe.\n" +
"Deux = on change de paragraphe.\n\n";
	texte += "Références pour les figures.\n\n" +
"COCO aide au référencement des pièces représentées sur les dessins de deux manières.\n" +
"On peut tout d'abord indiquer les numéros de référence entre parenthèses à l'intérieur des morceaux de texte énonçant les caractéristiques à revendiquer. Ainsi <_option a3 de='nouveau A'>a3 (12)</option> (corrigez l'écriture de la balise en supprimant le caractère _ pour observer l'effet de cette balise) déclare la référence 12 en lien avec la caractéristique a3. Cette référence apparaît dans les revendications du jeu de revendications, mais pas dans la description.\n" +
"Une autre possibilité est de déclarer une référence dans la description d'une figure (donc à l'intérieur de balises 'mdr'). Pour cela, il suffit d'indiquer la référence une seule fois, à l'intérieur de l'expression désignant la pièce. Par exemple :\n" +
"<_mdr 1>\n... qui sert pour la saisie par l'<_ref>organe de préhension 3 inférieur</ref> au-dessus de la surface de glissement.\n<_/mdr>\n" +
"Dans toute la description de ce mode de réalisation, y compris celle déjà mentionnée quelques lignes plus haut, partout où l'expression 'organe de préhension inférieur' apparaît, la référence 3 est automatiquement ajoutée.\n" +
"Et si l'on souhaite que la référence indiquée dans la description d'une figure soit déclarée comme cas particulier d'une caractéristique à revendiquer, il suffit de le déclarer dans la balise. Ainsi, en déclarant que la référence se rapporte à la caractéristique 'nouveau B' comme suit, on fait apparaître la référence 13 entre parenthèses dans le jeu de revendications :\n" +
"<_mdr 1>... et qui repose sur la <ref de='nouveau B'> surface de glissement 13</ref>.<_/mdr>\n" +
"Les doublons de références, qui sont a priori des erreurs, sont signalés dans le dictionnaire.\n\n" +
"Deux balises utiles :\n" +
"<_espacer='n m'/> pour espacer les numéros de référence d'un écart de n à partir de la référence m (optionnelle)\n" +
"<_reordonner='n m'> pour réordonner les numéros de référence par ordre d'arrivée dans le texte, à partir de n et avec l'espacement m (optionnel)\n\n";
	texte += "Autres balises utiles.\n\n" +
"D'autres options sont disponibles pour forcer COCO à répéter vos mots conformément à vos souhaits :\n" +
"- <_objet invention gn='mp'>dispositifs</objet> : la précision apportée par le paramètre 'gn' est le genre et le nombre de l'objet. Ce paramètre peut prendre les valeurs 'ms' pour masculin singulier, 'fs' pour féminin singulier, 'mp' pour masculin plusiel et 'fp' pour féminin pluriel.\n" +
"- <_option a1 de='objet invention'> et <_alternative a2bis de='option a1'> permettent de définir des caractéristiques devant servir de positions de repli, donc donnant lieu à des revendications dépendantes. Elles contiennent un paramètre 'de' qui permet de préciser à quelle autre balise de type 'option' ou 'alternative' se rapporte la caractéristique. Si on utilise une balise 'option' sur une balise 'objet', l'option apparait en dernier dans la liste des revendications, derrière les options liées aux caractéristiques introduites par les balises 'nouveau', 'option' et 'alternative'. Le même paramètre 'de' s'utilise dans toute balise qui se rapporte à une autre balise.\n" +
"- <lang_text='fr'/> : COCO parle français, c'est-à-dire que les phrases types servant à la construction du projet de demande de brevet sont en français. Voyez l'effet en remplaçant 'fr' par 'en' pour que COCO parle anglais.\n" +
"- <lang_tagnames='fr'/> : COCO comprend le français, c'est-à-dire que les noms de balises servant à identifier les mots à répéter sont en français. Voyez l'effet en remplaçant 'fr' par 'en' : COCO ne reconnaît alors plus aucune balise et ne sait plus utiliser son vocabulaire. Les noms des balises est indiqué dans la liste qui apparaît lorsqu'on survole le lien adéquat, au dessus de cette zone de frappe. Le projet de demande de brevet n'est plus construit. En revanche, si vous utilisez le nom anglais de chaque balise, COCO pourra à nouveau répéter vos morceaux de texte. Par exemple, si vous corrigez le nom de balise 'objet' en 'object' dans les deux balises définissant l'objet de l'invention (en première ligne du texte avec balises), COCO saura à nouveau ce qu'il convient de revendiquer. On le répète : Le nom de toutes les balises est visible en survolant le lien adéquat en haut, au dessus de cette zone de frappe (et qui s'intitule 'Mouse over to get the list of tags' si vous êtes toujours en anglais.\n" +
"- <_revs nom_jeu>...</revs> : pour saisir des revendications et demander à COCO de les reconnaître. COCO va essayer d'y repérer des numéros de référence, des dépendances de revendications et va créer une description générale cohérente avec les caractéristiques revendiquées.\nUtile pour demander à COCO de recalculer le jeu de revendications pour y supprimant des revendications (balise 'rayer' ci-dessous) ou pour vérifier des rattachements, ou encore pour redévelopper les revendications sans les dépendances multiples (balise 'dependance').\n" +
"- <jeu=''/> : en indiquant 'oui' entre les guillemets, on demande à COCO de reproduire les revendications telles qu'il les a reconnues dans la balise 'revs' (décrite ci-dessus). Seuls les rattachements sont modifiés car ils sont alors explicités.\n" +
"- <rayer=''/> : les revendications dont les numéros sont listés entre guillemets, séparés par des espaces, sont rayées du jeu de revendications. En revanche, elles sont maintenues dans la description, de manière à ce que la matière reste disponible pour des limitations ultérieures ou des divisions de la demande.\nCette balise ne fonctionne efficacement que si les revendications sont issues du calcul de COCO.\n" +

function SauverCookiePersonnalisation(langue) {
  var perso = {};
  for (var i=0; i<liste_expressions_personnalisees.length; i++) {
    var expression = 'expression_'+liste_expressions_personnalisees[i];
    var valeur_expression = eval(expression);
    var valeur_expression_par_defaut = expressions_par_defaut[liste_expressions_personnalisees[i]];
//    alert(liste_expressions_personnalisees[i]+' : '+valeur_expression);
    var chaine_test_string = eval('typeof '+expression);
//    alert(chaine_test_string);
    if (chaine_test_string == 'string') {
      var chaine_test = '"'+valeur_expression_par_defaut+'" != "'+valeur_expression+'"';
//      alert('if ('+chaine_test+')');
      var res = eval(chaine_test);
//      alert(res);
      if (res) {
        var chaine_action = 'perso.'+liste_expressions_personnalisees[i]+' = "'+valeur_expression+'";';
//        alert(chaine_action);
        eval(chaine_action);
      }
    }
    else {
      var chaine_test = '';
      var chaine_action = '';
      for (var j=0; j<valeur_expression.length; j++) {
        var expression_j = expression + '[' + j + ']';
        var valeur_expression_j = valeur_expression[j];
        var valeur_expression_par_defaut_j = valeur_expression_par_defaut[j];
//        alert("valeur_expression_par_defaut_j: "+valeur_expression_par_defaut_j);
        var chaine_test_j = '"'+valeur_expression_par_defaut_j+'" != "'+valeur_expression_j+'"';
        chaine_test = chaine_test + ((chaine_test.length > 1) ? ' || ':'') + '(' + chaine_test_j + ')';
        var chaine_action_j = ((chaine_action.length > 1) ? ', ':'') + expression_j;
        chaine_action = chaine_action + chaine_action_j;
      }
//      alert('if ('+chaine_test+')');
      var res = eval(chaine_test);
//      alert(res);
      if (res) {
        chaine_action = 'perso.'+liste_expressions_personnalisees[i]+' = [' + chaine_action + '];';
//        alert(chaine_action);
        eval(chaine_action);
      }
    }
  }
//  alert(JSON.stringify(perso));
  setCookie("COCO_perso_"+langue, JSON.stringify(perso), 365);
}


function ChargerCookiePersonnalisation(langue) {
  var cookie_chaine_libelles_persos = getCookie("COCO_perso_"+langue);
//  alert("cookie_chaine_libelles_persos"+" ?= "+cookie_chaine_libelles_persos);
  if (cookie_chaine_libelles_persos != "") {
    var libelles_persos = JSON.parse(cookie_chaine_libelles_persos);
    for (var expression in libelles_persos) {
      var valeur_expression = libelles_persos[expression];
//      alert(expression+' : '+valeur_expression);
      var chaine_test_string = 'typeof libelles_persos.'+expression;
//      alert('chaine_test_string : '+chaine_test_string);
      var valeur_test_string = eval(chaine_test_string);
//      alert('valeur_test_string : '+valeur_test_string);
      if (valeur_test_string == 'string') {
        var chaine_action = 'expression_'+expression+' = "'+libelles_persos[expression]+'";';
//        alert(chaine_action);
        eval(chaine_action);
      }
      else {
        for (var j=0; j<valeur_expression.length; j++) {
          var chaine_action = 'expression_'+expression+'['+j+'] = "'+libelles_persos[expression][j]+'";';
//          alert(chaine_action);
          eval(chaine_action);
        }
      }
    }
  }
}

function ToHTML(texte) {
	texte = texte.replace(/</g, '&lt;');
	texte = texte.replace(/>/g, '&gt;');
	texte = texte.replace(/_n_/g, '<br />');
	return texte;	
}

			if (res2 != null) {

				if (res2[2][0]==res2[2][0].toUpperCase()) {
					lemotifremplacement = uppermotifremplacement;
				}
				else {
					lemotifremplacement = lowermotifremplacement;
				}

				expression_remplacement = res2[1]+lemotifremplacement+res2[3];
				question = confirm('"' + res[i] + '"   =>   "' + expression_remplacement + '" ?');
				if (question) {
					texte_de_travail = texte_de_travail.replace(res[i], expression_remplacement);
					nombre_de_remplacements += 1;
				}					
			}
		}
	}

	//substitution de la commande par le resultat
	if (nombre_de_remplacements > 0) {
		chaine_resultat += ' : x ' + nombre_de_remplacements;
		texte_de_travail = texte_de_travail.replace('__CO_resultat_remplacement_CO__', chaine_resultat);

	}

	else return texte;
}

function AjouterBalise(texte) {
	var taille_texte = texte.length;
	var les_tagnames = tagnames_attendus;
	var chaine_nombre = '';
	var debut = 0;
	var emplacement = 0;
	var fin = 0;
	var nombre_de_mots = 0;
	var nombre_total_de_mots = 0;
	var sous_texte = '';
	var chaine_mots = '';
	var longueur_chaine_mots = 0;
	var liste_mots = sous_texte.split(' ');
	var suite = '';
	var res = '';
	var nombre = 0;
	var le_nom = '';
	var idobjetconcerne = '';
	for (var i=0; i<les_tagnames.length; i++) {
		var patt = new RegExp('('+les_tagnames[i]+')([0-9]+)\\s', 'i');
		emplacement = texte.search(patt);
		if (emplacement > 0) {
			debut = emplacement;
			sous_texte = texte.substr(debut);
			fin = sous_texte.search(/\n|$/);
			sous_texte = texte.substr(debut, fin);
			res = patt.exec(sous_texte);
			chaine_nombre = res[2];
			nombre_de_mots = Number(chaine_nombre);
			liste_mots = sous_texte.split(/'|;|\n|\s|,|\.|^|$/);
			nombre_total_de_mots = liste_mots.length - 1;
			nombre = ((nombre_de_mots > nombre_total_de_mots) ? nombre_total_de_mots:nombre_de_mots);
			longueur_chaine_mots = liste_mots[1].length;
			for (var j=2; j<=nombre; j++) {
				longueur_chaine_mots += 1 + liste_mots[j].length;
			}
			chaine_mots = sous_texte.substr(liste_mots[0].length+1, longueur_chaine_mots);
//			suite = texte.substr(emplacement + les_tagnames[i].length + chaine_mots.length + 2);
			suite = texte.substr(emplacement + liste_mots[0].length + longueur_chaine_mots + 1);
			// pour une reference :
			if (les_tagnames[i]==tagname_ref) return texte.substr(0, emplacement) + '<' + les_tagnames[i] + '>' + chaine_mots + '</'+ les_tagnames[i] + '>' + suite;
			// pour les autres tags :
			patt = new RegExp(MotifBaliseOuvrante(), 'ig');
			if ((les_tagnames[i] == tagname_precomplement) || (les_tagnames[i] == tagname_prequalificatif) || (les_tagnames[i] ==tagname_verbe)) {
				res = patt.exec(suite);
			}
			else {
				var avant = texte.substr(0, emplacement);
				var res2 = avant.match(patt);
				if (res2.length) {
					res = patt.exec(res2[res2.length-1]);
				}
				else res = null;
			}
			le_nom = ' .';
			if (res==null) return texte.substr(0, emplacement) + '<' + les_tagnames[i] + le_nom + '>' + chaine_mots + MotifBaliseFermante(les_tagnames[i]) + suite;
			else {
				idobjetconcerne = res[2];
				return texte.substr(0, emplacement) + '<' + les_tagnames[i] + le_nom + ' ' + tagname_de+'=\''+idobjetconcerne+'\'>' + chaine_mots + MotifBaliseFermante(les_tagnames[i]) + suite;
			}
		}
	}
	return texte;
}

function Personnalisation(motif, texte) {
	var motifrecherche = "<" + motif + "='([^'\\/>]*)'\\/>"; 
	var patt = new RegExp(motifrecherche, "igm");
	var res = texte.match(patt);
	if (res != null) {
		for (var i=0 ; i < res.length ; i++) {
			var valeur = res[i].replace(patt, '$1');
			if (valeur.length < texte.length) return valeur;
		}
	}
	return null;

	}

		prequal = SansVirgule(liste_valeurs_complementees(liste_balises_precisantes_de_type(balise, tagname_prequalificatif), inclure_references));
		postqual = SansVirgule(liste_valeurs_complementees(liste_balises_precisantes_de_type(balise, tagname_postqualificatif), inclure_references));

	}

	}
	else {
		texte_objet = balise.valeur;
		texte_objet = SupprimeJoker(texte_objet);
	}
//	if (inclure_references) alert("texte_objet de "+balise.valeur+" : "+texte_objet);

//	var texte = ourien('', groupe_precomplements(balise, inclure_references, qualificatifs), ' ') + ourien('', prequal, ' ') + texte_objet + ourien(' ', postqual, '') + ourien(' ', groupe_postcomplements(balise, inclure_references, qualificatifs), '');

function groupe_complement(avant, balise, inclure_references, qualificatifs) {
	var complement = '';
	if (avant) var balises_complements = liste_balises_precomplements(balise);
	else var balises_complements = liste_balises_postcomplements(balise);
	for (var index = 0; index < balises_complements.length; index++) {
		complement = ourien('', complement, ' ') + groupe_nominal(balises_complements[index], inclure_references, qualificatifs);
	}
	return complement;
}

function Decouper(expression) {
	var expression_retravaillee = expression.replace(/\s/g, '__COsprtrCO__');
	expression_retravaillee = expression_retravaillee.replace(/\'/g, '\'__COsprtrCO__');
	var decoupe = expression_retravaillee.split(/__COsprtrCO__/);
	if (decoupe[decoupe.length-1]=='') decoupe.pop();
	if (decoupe[0].substr(0,3)=='_n_') decoupe[0] = decoupe[0].substr(3);
	if (decoupe[0]==champ_puce) decoupe.shift();
	return decoupe;
}

function Valeur_balise_article_defini(balise, inclure_references, qualificatifs) {
	// on regarde si le genre et le nombre sont definis
	if (balise.genrenombre != '') {
		var expression = Retirer_Article(groupe_nominal(balise, inclure_references, qualificatifs));
		return liaison(article_defini(balise.genrenombre, Decouper(expression)[0]), expression);
	}
	// sinon on essaie de reconnaitre le premier mot de l'expression
	else return Rendre_Defini(groupe_nominal(balise, inclure_references, qualificatifs));
}

function Rendre_Defini(expression) {
	return Manipuler_Article(expression, 'Rendre_Defini');
}

function Retirer_Article(expression) {
	var decoupe = Decouper(expression);
	var reponse = '';
	if (tous_les_articles.includes(decoupe[0].toLowerCase())) reponse = expression.substr(decoupe[0].length).trim();
	else reponse = expression;
	return reponse;
}

function Manipuler_Article(expression, action) {
	if (expression == '') return '';
	if (expression.length == 1) return expression;
	var decoupe = Decouper(expression);
	var nouveau_mot = '';
	var longueur_supprimee = 0;
	switch(decoupe[0]) {
		case article_indefini_ms:
		case article_indefini_elide_ms:
			if (action == 'Rendre_Defini') {
				nouveau_mot = article_defini('ms', decoupe[1]);
				longueur_supprimee = decoupe[0].length;
			}
			else nouveau_mot = '';
			break;
		case article_indefini_fs:
		case article_indefini_elide_fs:
			if (action == 'Rendre_Defini') {
				nouveau_mot = article_defini('fs', decoupe[1]);
				longueur_supprimee = decoupe[0].length;
			}
			else nouveau_mot = '';
			break;
		case article_indefini_mp:
		case article_indefini_elide_mp:
			if (action == 'Rendre_Defini') {
				nouveau_mot = article_defini('mp', decoupe[1]);
				longueur_supprimee = decoupe[0].length;
			}
			else nouveau_mot = '';
			break;
		case article_indefini_fp:
		case article_indefini_elide_fp:
			if (action == 'Rendre_Defini') {
				nouveau_mot = article_defini('fp', decoupe[1]);
				longueur_supprimee = decoupe[0].length;
			}
			else nouveau_mot = '';
			break;
		default:
			if (action == 'Rendre_Defini') {
				nouveau_mot = liaison(article_defini('mp', decoupe[0]), decoupe[0]);
				longueur_supprimee = decoupe[0].length;
			}
			else {
				if (decoupe[0] in [article_defini_ms, article_defini_fs, article_defini_mp, article_defini_fp, article_defini_elide_ms, article_defini_elide_fs, article_defini_elide_mp, article_defini_elide_fp]) {
					nouveau_mot = '';
				}
				else {
					nouveau_mot = decoupe[0];
					longueur_supprimee = decoupe[0].length;
				}
			}
			break;
	}
	return liaison(nouveau_mot, expression.substr(expression.search(decoupe[0])+longueur_supprimee+1));
}

function texte_commentaire(tagname, expressions_premiere_introduction, introduction_autre, liste_balises_a_commenter, inclure_numpar) {
	var texte = '';
	var precision = '';
	var avantage = '';
	var valeur_sans_article = '';
	var gn = '';
	var liste_balises_commentaires = [];
	var nouveau_paragraphe = '</p><p>' + Numero_de_paragraphe_affiche(inclure_numpar);
	// boucle sur balises a commenter
	for (var index = 0; index < liste_balises_a_commenter.length; index++) {
		liste_balises_commentaires = liste_balises_precisantes_de_type(liste_balises_a_commenter[index], tagname);
		// boucle sur balises commentaires
		if (liste_balises_commentaires.length > 0) {
			if ((tagname != tagname_but) && (TypeDe(liste_balises_a_commenter[index]) != tagname_revendication)) {
				valeur_sans_article = Retirer_Article(liste_balises_a_commenter[index].valeur);
				gn = liste_balises_a_commenter[index].genrenombre;
			}
			else if (TypeDe(liste_balises_a_commenter[index]) == tagname_revendication) {
				valeur_sans_article = expression_caracteristiques_ci_dessus;
				gn = 'fp';
			     }
           else {
            valeur_sans_article = expression_designation_invention;
            gn = 'fs';
           }
			// la premiere
			if (VraiFaux(liste_balises_commentaires[0].continu)) {
//				texte += ((texte) ? ' ':'') + capitalizeFirstLetter(phrase_premier_commentaire(expressions_premiere_introduction, '', 'ms', liste_balises_commentaires[0].valeur));
				texte += ((texte) ? ((index > 0) ? nouveau_paragraphe:''):'') + capitalizeFirstLetter(liste_balises_commentaires[0].valeur);			}
			else {
				texte += ((texte) ? ((index > 0) ? nouveau_paragraphe:''):'') + capitalizeFirstLetter(phrase_premier_commentaire(expressions_premiere_introduction, valeur_sans_article, gn, liste_balises_commentaires[0].valeur));
			}
			precision = texte_precisions([liste_balises_commentaires[0]], inclure_numpar);
			//avantage = texte_avantages([liste_balises_commentaires[0]], inclure_numpar)
			
			if (precision != '') texte += '</p><p>' + Numero_de_paragraphe_affiche(inclure_numpar) + precision; // + avantage;
			
			if (liste_balises_commentaires.length > 1) {
				// les suivantes
				for (var index2 = 1; index2 < liste_balises_commentaires.length; index2++) {
					texte += '</p><p>' + Numero_de_paragraphe_affiche(inclure_numpar);
					texte += capitalizeFirstLetter(phrase_commentaire_suivant(false, introduction_autre, liste_balises_commentaires[index2].valeur));
					precision = texte_precisions([liste_balises_commentaires[index2]], inclure_numpar);
					//avantage = texte_avantages([liste_balises_commentaires[index2]], inclure_numpar);
					if (precision != '') texte += '</p><p>' + Numero_de_paragraphe_affiche(inclure_numpar) + precision; // + avantage;
//						texte += ' ' + liaison(introduction_autre, liste_balises_commentaires[index2].valeur) + '.';
				}
			}
		}
	}
	return texte;
}

function listes_balises_precisantes_de_type(balise, typebalise) {
	// avec prise en compte des alternatives et retour d'une liste de listes, chaque liste correspondant a une alternative
	var reponses = [[]];
	var nb_reponses = 0;
	var autre_reponse = [];
	for (var index = 0; index < balises.length; index++) {
		lobjetconcerne = balises[index].idobjetconcerne;
		letypebalise = TypeDe(balises[index]);
		if (lobjetconcerne == balise.idobjet && letypebalise == typebalise) {
			alternatives = liste_balises_alternatives(balises[index]);
			nb_reponses = reponses.length;
			for (var index2 = 0; index2 < alternatives.length; index2++) {
				for (var index3 = 0; index3 < nb_reponses; index3++) {
					autre_reponse = duplique_liste(reponses[index3]);
					autre_reponse.push(alternatives[index2]);
					reponses.push(autre_reponse);
				}
			}
			reponses[0].push(balises[index]);
		}
	}
	return reponses;
}

function duplique_liste(liste) {
	var nouvelle_liste = [];
	for (var index = 0; index < liste.length; index++) {
		nouvelle_liste.push(liste[index]);
	}
	return nouvelle_liste;
}

function fusionne(liste1, liste2) {
	if (liste1.length == 0) return liste2;
	if (liste2.length == 0) return liste1;
	return [].concat(liste1, liste2);
}

function normalise(liste1, liste2) {
	// fusionne, ordonne et supprime les doublons
	var liste = fusionne(liste1, liste2);
	liste.sort(function(a, b){return a-b}); // tri numerique
	for (var i=0; i<liste.length - 1; i++) {
		if (liste[i] == liste[i+1]) {
			liste.splice(i,1);
		}
	}
	return liste;
}

function liste_valeurs_complementees(liste_balises, inclure_references) {

	for (var index = 0; index < liste_balises.length; index++) {
		liste_valeurs.push(ValeurComplementee(liste_balises[index], inclure_references));

}

function values(dico) {

    for( var key in dico ) {
        if ( dico.hasOwnProperty(key) ) {
            vals.push(dico[key]);
        }
    }
    return vals;
}

function keys(dico) {
    var keys = [];
    for( var key in dico ) {
        if ( dico.hasOwnProperty(key) ) {
            keys.push(key);
        }
    }
    return keys;
}

function EnumereValeurs(dico) {

function EnumereCles(dico) {
	var reponse = VirguleEt(keys(dico));

}

function balises_identiques(balise1, balise2) {
	var identiques = true;
	for( var key in balise1 ) {
		if ( balise1.hasOwnProperty(key)) {
			if ( balise2.hasOwnProperty(key) ) {
				if (balise1[key] != balise2[key]) {
					identiques = false;
					break;
				}
			}
			else {
				identiques = false;
				break;
			}
		}
	}
	return identiques;
}

function verbe(balise) {

function VraiFaux(valeur) {
	if (valeur == 'oui') return true;
	if (valeur == 'Oui') return true;
	if (valeur == 'OUI') return true;
	if (valeur == 1) return true;
	if (valeur == '1') return true;
	if (valeur == 'yes') return true;
	if (valeur == 'Yes') return true;
	if (valeur == 'YES') return true;
	return false;
}

function FabriqueSousRevendication(liste_numeros_maitresses, balise_objet, balise_a_preciser, balise_precisante, inclure_references, dependance_revendications, inclure_numpar) {
// si meme balise ou si balise precisante definie comme continue, pas de a_preciser
	if (balises_identiques(balise_objet, balise_a_preciser) || VraiFaux(balise_precisante.continu)) var a_preciser = null;
	else var a_preciser = Valeur_balise_article_defini(balise_a_preciser, inclure_references, false);
//		Rendre_Defini(groupe_nominal(balise_a_preciser, inclure_references, false));
	var avantages = texte_avantages([balise_precisante], inclure_numpar);
	var precisions = texte_precisions([balise_precisante], inclure_numpar);
	var definitions = texte_definitions([balise_precisante], inclure_numpar);
	var le_verbe = verbe(balise_precisante);
// si balise precisante definie comme continue, pas de verbe
	// remplacer par une fonction pour la langue FIXME
	var objetsousrev = AjouteRevendication(false, liste_numeros_maitresses, dependance_revendications, balise_objet, inclure_references, [a_preciser], le_verbe, [groupe_nominal(balise_precisante, inclure_references, true)], '', avantages, definitions, precisions);
	return objetsousrev;
}

function FabriqueRevendicationObjet(liste_numeros_maitresses, balise_objet, inclure_references, dependance_revendications, inclure_numpar) {
	var les_connus = liste_balises_connus(balise_objet);
	var connus = Virgule(liste_valeurs_complementees(les_connus, inclure_references));
	var problemes = texte_problemes(les_connus, inclure_numpar);
	var les_nouveaux = liste_balises_nouveaux(balise_objet);
	var nouveaux = VirguleEt(liste_valeurs_complementees(les_nouveaux, inclure_references));
	var avantages = texte_avantages(les_nouveaux, inclure_numpar);
	var les_balises_connu_et_nouveau = [].concat(les_connus, les_nouveaux);
	var definitions = texte_definitions(les_balises_connu_et_nouveau, inclure_numpar);
	var precisions = texte_precisions(les_balises_connu_et_nouveau, inclure_numpar);
	var objetrev = AjouteRevendication(true, liste_numeros_maitresses, dependance_revendications, balise_objet, inclure_references, connus, '', nouveaux, problemes, avantages, definitions, precisions);
	var caracteristiques = [].concat(les_nouveaux, les_connus);
	var liste_nums_rev = [];
	if (ordonner_caracteristiques) {
		caracteristiques = Balises_par_numero_croissant(caracteristiques);
	}
	caracteristiques.push(balise_objet);
	if (objetrev.rayee != '1') {
		liste_nums_rev = [objetrev.numero];
		for (var index = 0; index < caracteristiques.length; index++) {
			var liste_nums_sous_rev = FabriqueSousRevendications(liste_nums_rev, balise_objet, caracteristiques[index], inclure_references, dependance_revendications, inclure_numpar);
			liste_nums_rev = fusionne(liste_nums_rev, liste_nums_sous_rev);
		}
	}
	return liste_nums_rev;
}

function empty(liste_de_liste) {
	var total = 0;
	for (var index_liste = 0; index_liste < liste_de_liste.length; index_liste++) {
		total += liste_de_liste[index_liste].length;
	}
	return (total == 0);
}

function FabriqueSousRevendications(liste_numeros_maitresses, balise_objet, caracteristique, inclure_references, dependance_revendications, inclure_numpar) {
	var les_balises_options = liste_balises_options(caracteristique);
	var les_balises_objets_dependants = liste_balises_objets_dependants(caracteristique);
	var liste_nums_rev_option = FabriqueRevendicationsDependantes(les_balises_options, liste_numeros_maitresses, balise_objet, caracteristique, inclure_references, dependance_revendications, inclure_numpar);
	if (les_balises_objets_dependants.length > 0) {
		var liste_nums_rev_objets_dependants = FabriqueRevendicationsDependantes(les_balises_objets_dependants, fusionne(liste_numeros_maitresses, liste_nums_rev_option), balise_objet, caracteristique, inclure_references, dependance_revendications, inclure_numpar);
	}
	else var liste_nums_rev_objets_dependants = [];
	return fusionne(liste_nums_rev_option, liste_nums_rev_objets_dependants);
}

function FabriqueRevendicationsDependantes(liste_balises_dependantes, liste_numeros_maitresses, balise_objet, caracteristique, inclure_references, dependance_revendications, inclure_numpar) {
	if (liste_balises_dependantes.length == 0) return [];
	var liste_nums_rev = [];
	var liste_numeros_meres = liste_numeros_maitresses;
	if (ordonner_caracteristiques) {
		liste_balises_dependantes = Balises_par_numero_croissant(liste_balises_dependantes);
	}
	var liste_nums_rev_dep = [];
	for (var index = 0; index < liste_balises_dependantes.length; index++) {
		var les_balises_alternatives = fusionne([liste_balises_dependantes[index]], liste_balises_alternatives(liste_balises_dependantes[index]));
		if (ordonner_caracteristiques) {
			les_balises_alternatives = Balises_par_numero_croissant(les_balises_alternatives);
		}
		for (var i=0; i<les_balises_alternatives.length; i++) {
			if (dependance_revendications == valeur_tagname_dependance_multiple) {
				// creation des sous revendications de la caracteristique sur la bases de l'option et de ses alternatives
			// FIXME faire de meme dans le cas sans dependance multiple 
				if (TypeDe(les_balises_alternatives[i]) != tagname_objet) {
					var objet_sous_rev = FabriqueSousRevendication(liste_numeros_meres, balise_objet, caracteristique, les_balises_alternatives[i], inclure_references, dependance_revendications, inclure_numpar);
					if (objet_sous_rev.rayee != '1') {
						liste_nums_rev_dep.push(objet_sous_rev.numero);
						// pour l'option seulement (i.e. pas les alternatives), creation des sous revendications de l'option
						var liste_nums_sous_rev = FabriqueSousRevendications([objet_sous_rev.numero], balise_objet, les_balises_alternatives[i], inclure_references, dependance_revendications, inclure_numpar);
					}
				}
				else {
					var liste_nums_sous_rev = FabriqueRevendicationObjet(liste_numeros_meres, les_balises_alternatives[i], inclure_references, dependance_revendications, inclure_numpar);
				}
				liste_nums_rev_dep = fusionne(liste_nums_rev_dep, liste_nums_sous_rev);
			}
			else {
				var objets_sous_rev = [];
				for (var index_rev_maitresse = 0; index_rev_maitresse < liste_numeros_meres.length; index_rev_maitresse++) {
					objets_sous_rev[index_rev_maitresse] = FabriqueSousRevendication([liste_numeros_meres[index_rev_maitresse]], balise_objet, caracteristique, les_balises_alternatives[i], inclure_references, dependance_revendications, inclure_numpar);
					if (objets_sous_rev[index_rev_maitresse].rayee != '1') {
						liste_nums_rev.push(objets_sous_rev[index_rev_maitresse].numero);
					}
				}
				for (var index_rev_maitresse = 0; index_rev_maitresse < liste_numeros_meres.length; index_rev_maitresse++) {
					if (objets_sous_rev[index_rev_maitresse].rayee != '1') {
						var liste_nums_sous_rev = FabriqueSousRevendications([objets_sous_rev[index_rev_maitresse].numero], balise_objet, liste_balises_dependantes[index], inclure_references, dependance_revendications, inclure_numpar);
						liste_nums_rev = fusionne(liste_nums_rev, liste_nums_sous_rev);
					}
				}
				liste_nums_rev_dep = fusionne(liste_nums_rev_dep, liste_nums_rev);
			}
		}
		liste_numeros_meres = normalise(liste_numeros_meres, liste_nums_rev_dep);
	}
 	return liste_nums_rev_dep;
}

function FabriqueRevendicationsObjet(inclure_references, dependance_revendications, inclure_numpar) {
	var balises_objets = liste_balises_objets_independants();
	var liste_nums_rev = [];
	for (var index = 0; index < balises_objets.length; index++) {
		var liste_nums_rev = fusionne(liste_nums_rev, FabriqueRevendicationObjet([], balises_objets[index], inclure_references, dependance_revendications, inclure_numpar));

function AjouteRevendication(est_principale,liste_numeros_maitresses, multidependance, balise_objet, inclure_references, connus, verbe, nouveaux, problemes, avantages, definitions, precisions) {
	var rayee = false;
	if (revendications_rayees.length > 0) {
		if (numero == revendications_rayees[0]) {
			revendications_rayees.shift();
			rayee = true;
		}
	}

	var objetrev = FabriqueObjetRev(est_principale, liste_numeros_maitresses, multidependance, balise_objet, inclure_references, connus, verbe, nouveaux, problemes, avantages, definitions, precisions, rayee);
	if (!rayee) numero ++;
	revendications.push(objetrev);
//	alert('Revendication '+objetrev.numero+' ajoutée');
	return objetrev;
}

function FabriqueObjetRev(est_principale, liste_numeros_maitresses, multidependance, balise_objet, inclure_references, connus, verbe, nouveaux, problemes, avantages, definitions, precisions, rayee) {
	var texte = '{ "numero" : "' + numero + '", "est_principale" : "' + (est_principale ? '1':'') + '", "objet" : "' + groupe_nominal(balise_objet, inclure_references, (liste_numeros_maitresses == '')) + '", "genrenombre" : "' + balise_objet.genrenombre + '", "references" : "' + References(balise_objet, inclure_references, mdr_global, true) + '" , "connu" : "' + connus + '", "verbe" : "' + verbe +'", "nouveau" : "' + nouveaux + '", "problemes" : "' + problemes+ '", "avantages" : "' + avantages  + '", "definitions" : "' + definitions  + '", "precisions" : "' + precisions  + '", "dependance":' + ((liste_numeros_maitresses != '') ? '"[' + liste_numeros_maitresses + ']"' : '""') + ', "multidependance" : "' + multidependance + '", "rayee" : "' + ((rayee) ? '1':'0') + '"} ';
	var ArrayRev = FabriqueObjet(texte);

	return ArrayRev;
}

function RattacheDernieresRevendications(objetsrevs, dependance_revendications) {
	if (dependance_revendications == valeur_tagname_dependance_unique_sauf_revendications_non_maitresses) {
		_RattacheDernieresRevendications(objetsrevs, objetsrevs.length - 1);
	}
}

function numeros_revendications_maitresses(objetsrevs) {
	var liste = [];
	for (var i=0; i<objetsrevs.length; i++) {
		if (objetsrevs[i].dependance != '') {
			//alert('fabrication dependance pour '+objetsrevs[i].numero+'. '+objetsrevs[i].objet+' :'+objetsrevs[i].dependance);
			liste_dependances = FabriqueObjet(objetsrevs[i].dependance);
			//alert('resultat : '+liste_dependances);
			for (var j=0; j<liste_dependances.length; j++) {
				if (liste.indexOf(liste_dependances[j]) == -1) {
					liste.push(liste_dependances[j]);
				}
			}
		}
	}
	return liste;
}

function _RattacheDernieresRevendications(objetsrevs, indice) {
//	alert("indice "+indice);
	if (indice == 0) return;
	var objetetudie = objetsrevs[indice];
	var supprimable = false;
	for (var i=indice-1; i>=0; i--) {
		if (liste_revendications_meres.indexOf(parseInt(objetetudie.numero)) == -1) {
			if (ObjetsRevMemesCaracteristiques(objetetudie, objetsrevs[i])) {
				AjouteDependance(objetetudie, objetsrevs[i]);
				supprimable = true;
			}
		}
	}
	if (supprimable) {
//		alert("suppression "+indice);
		SupprimeObjetRev(objetsrevs, indice);
	}
	_RattacheDernieresRevendications(objetsrevs, indice-1);
}

function ObjetsRevMemesCaracteristiques(objetrev1, objetrev2) {
	var reponse = false;
	if (objetrev1.rayee != "1") if (objetrev2.rayee != "1") if (objetrev1.objet == objetrev2.objet) if (objetrev1.connu == objetrev2.connu) if (objetrev1.nouveau == objetrev2.nouveau) reponse=true;
	return reponse;
}

function SupprimeObjetRev(objetsrevs, indice) {
	a_supprimer = objetsrevs[indice];
	// dans toutes les revendications, decaler de 1 chaque fois qu'une revendication a un numero >= au numero
	// le changement doit etre opere dans les numeros et dans les rattachements
	for (var i=0; i<objetsrevs.length; i++) {
		if (i != indice) {
			if (parseInt(objetsrevs[i].numero) > parseInt(a_supprimer.numero)) {
				objetsrevs[i].numero--;
			}

			if ((objetsrevs[i].dependance) && (objetsrevs[i].dependance != "")) {
				var liste_dependances = FabriqueObjet(objetsrevs[i].dependance);
				for (var j=0; j<liste_dependances.length; j++) {
					if (parseInt(liste_dependances[j]) > parseInt(a_supprimer.numero)) {
						if ((j>0) && (liste_dependances[j-1]==a_supprimer.numero)) liste_dependances.splice(j,1);
						else liste_dependances[j]--;
					}
				}
				objetsrevs[i].dependance = '[' + liste_dependances + ']';
			}
		} 
	}
	// ensuite, on peut supprimer la revendication
	objetsrevs.splice(indice,1);
	return;
}

function AjouteDependance(objetrevsource, objetrevcible) {
	var liste_dependances_source = FabriqueObjet(objetrevsource.dependance);
	var liste_dependances_cible = FabriqueObjet(objetrevcible.dependance);
	objetrevcible.dependance = "[" + normalise(liste_dependances_source, liste_dependances_cible) + "]";
	return;
}

function ourien(prefixe, texte, suffixe) {
	if ((prefixe==' ') && (texte[0]==',')) prefixe = '';
	return ((texte != '') ? prefixe+texte+suffixe : '');
}

function FabriqueTexteRev(ObjetRev) {
	if (!(ObjetRev)) return '';
	var nouveaute = '';
	
	if (ObjetRev.est_principale) {
		nouveaute = ourien(', ', ObjetRev.connu, '') + ourien(', ', liaison(liaison_caracterisante(ObjetRev.genrenombre), ObjetRev.nouveau), '');
	}
	else {
		if (commence_par_participe_present(ObjetRev.verbe)) {
			nouveaute = ', ' + ourien('', ObjetRev.verbe, ' ') + ObjetRev.nouveau;
    	}
    	else {
  		  	var sujet_plus_verbe_plus_nouveau = ourien('', ObjetRev.connu, ' ') + ourien('', ObjetRev.verbe, ' ') + ObjetRev.nouveau;
      		nouveaute = ', ' + liaison_option(ObjetRev.genrenombre, sujet_plus_verbe_plus_nouveau) + ' ' + sujet_plus_verbe_plus_nouveau;
      	}
	}
	var dependance = Dependance(ObjetRev.dependance, ObjetRev.multidependance);
	var texte = ((ObjetRev.est_principale) ? '<b>':'') + ((ObjetRev.rayee == '1') ? '*** supprimée *** ':'') +
		ObjetRev.numero + ((ObjetRev.est_principale) ? '</b>':'') + '.' + ' ' + capitalizeFirstLetter(ObjetRev.objet);
	if (!ObjetRev.est_principale) texte += dependance + nouveaute;
	else texte += nouveaute + dependance;
	texte += ((ObjetRev.rayee == '1') ? ' *** supprimée ***':'') + '.'
	return texte;
}

function ReconnaitreRevendication(texte) {
	var liste_multidependance = [true, false];
	var liste_nombre = [1, 2];
	var liste_gn = ['ms', 'fs', 'mp', 'fp'];
	var multidependance = [];
	var patt = '';
	var genrenombre = '';
	var res;
	var nombre = 0;
	for (var i=0; i<liste_gn.length; i++) {
		genrenombre = liste_gn[i];

		patt = new RegExp(MotifRevendicationIndependante(genrenombre), 'im');
		res = patt.exec(texte);
		if (res!=null) {
//			alert('independante/'+nombre+'/'+genrenombre+':'+patt);
			return {genrenombre:genrenombre, multidependance:false, dep:false, res:res};
		}

    patt = new RegExp(MotifRevendicationIndependanteElision(genrenombre), 'im');
    res = patt.exec(texte);
    if (res!=null) {
//      alert('independante/'+nombre+'/'+genrenombre+':'+patt);
      return {genrenombre:genrenombre, multidependance:false, dep:false, res:res};
    }

		patt = new RegExp(MotifRevendicationDependanteQlcPrecedentes(genrenombre), 'im');
		res = patt.exec(texte);
		if (res!=null) {
//			alert('dependante qlc prec/'+nombre+'/'+genrenombre+':'+patt);
			return {genrenombre:genrenombre, multidependance:"qlc", dep:true, res:res};
		}

		patt = new RegExp(MotifRevendicationDependanteLaPrecedente(genrenombre), 'im');
		res = patt.exec(texte);
		if (res!=null) {
//			alert('dependante la prec/'+nombre+'/'+genrenombre+':'+patt);
			return {genrenombre:genrenombre, multidependance:"prec", dep:true, res:res};
		}

		for (var k=0; k<liste_nombre.length; k++) {
			nombre = liste_nombre[k];
			for (var j=0; j<liste_multidependance.length; j++) {
				multidependance = liste_multidependance[j];
				patt = new RegExp(MotifRevendicationDependanteListe(genrenombre, nombre, multidependance), 'im');
				res = patt.exec(texte);
				if (res!=null) {
//					alert('multidependante ? '+multidependance+'/'+nombre+'/'+genrenombre+':'+patt);
					return {genrenombre:genrenombre, multidependance:multidependance, dep:true, res:res};
				}

				patt = new RegExp(MotifRevendicationDependanteRange(genrenombre, nombre, multidependance), 'im');
				res = patt.exec(texte);
				if (res!=null) {
//					alert('multidependante ? '+multidependance+'/'+nombre+'/'+genrenombre+':'+patt);
					return {genrenombre:genrenombre, multidependance:multidependance, dep:true, res:res};
				}
			}
		}
	}
//	alert('non trouve');
	return null;
}

function ReconstruitRevendicationsSaisies(inclure_references, texte) {
	//reperer les revendications
	var rep = 0;
	var numero = 0;
	var objet = '';
	var verbe = '';
	var connu = '';
	var texte_avec_references_objet = '';
	var option = '';
	var dependance = '';
	var corps = '';
	var multidependance = true;
	var texte_avec_references = '';
	var texte_avec_references_option = '';
	var typebalise = '';
	var balise_objet_rev_saisie;
	var emplacement = 0;
	var chaine_trouvee = '';
	var prequal = '';
	var postqual = '';
	var numero_rev_parente = 0;
	var ancien_idobjet = '';
	var nouvel_idobjet = '';
	var idobjet = '';
	var rev_html = '';
	var patt_rev_html = '';
	var au_moins_une = false;
	var patt = new RegExp(MotifRevendication(),'igm');
	var res = texte.match(patt);
	var liste_types_balises_a_supprimer = [tagname_objet, tagname_option, tagname_prequalificatif, tagname_postqualificatif, tagname_precomplement, tagname_postcomplement, tagname_nouveau, tagname_alternative, tagname_verbe, tagname_revendications_saisies, tagname_ref];
	if (res!=null) {
		//destruction des balises de revendications 'R'
		for (var i=0; i<balises.length; i++) {
			if (TypeDe(balises[i])==tagname_revendication) {
				balises.splice(i,1);
				i--;
			}
		}
		for (var i=0; i<res.length; i++) {
			numero = res[i].replace(patt,'$2');
			corps = res[i].replace(patt,'$5');
			CreeBalise(tagname_revendication+' '+numero, corps, '', '', '', corps, mdr_global, '', '');
			au_moins_une = true;
		}
	}
	if (au_moins_une) {
		//detruire balises de types servant à définir des caractéristiques (car on va les reconstruire en analysant les revendications)
		references_identifiees = '';
		for (var i=0; i<balises.length; i++) {
			if (liste_types_balises_a_supprimer.indexOf(TypeDe(balises[i]))>0) {
				balises.splice(i,1);
				i--;
			}
		}
		//creer les objets et les revendications
		var balises_revs = liste_balises_de_type(tagname_revendication);
		for (var i=0; i<balises_revs.length; i++) {
			rep = ReconnaitreRevendication(balises_revs[i].valeur);
			numero = NumeroRevendication(balises_revs[i]);
			if (rep!=null) {
				objet = rep.res[1].trim();
				texte_avec_references_objet = AnalyseParentheses(objet);
				rev_html = ToHTML(FormatRegex(rep.res[0]));
				patt_rev_html = new RegExp('((\\[Revendication\\s)*'+numero+'(\\]|\\.)(\\t|\\s)'+rev_html+'\\.)', 'im');

				if (rep.dep==true) {
//					alert(numero+' multidep:'+rep.multidependance);
					if (rep.multidependance=="qlc") {
						option = rep.res[3].trim();
						dependance = Range(parseInt(numero)-1);
						corps = rep.res[3].trim();
						multidependance = false;
						verbe = rep.res[2].trim();
					}
					else {
						if (rep.multidependance=="prec") {
							option = rep.res[3].trim();
							dependance = [parseInt(numero)-1];
							corps = rep.res[3].trim();
							multidependance = false;
							verbe = rep.res[2].trim();
						}
						else {
							option = rep.res[4].trim();
							dependance = ExtraitReferences(rep.res[2]);
							corps = rep.res[4].trim();
							multidependance = rep.multidependance;
							verbe = rep.res[3].trim();
						}
					}
					texte_avec_references = AnalyseParentheses(option);
					autre_rev_meme_dependance = RevendicationAvecDependance(dependance);
					// si pas deja une autre revendication avec les memes rattachements, il faut creer une option de l'objet de la premiere revendication dont on depend
					if (autre_rev_meme_dependance==null) {
						typebalise = tagname_option;
						balise_objet_rev_saisie = BaliseObjetRevSaisie(dependance[0]);
						if (balise_objet_rev_saisie==null) {
							balise_objet_rev_saisie = BaliseObjetRevSaisie(1);
							alert("dependance:"+dependance[0]+" balise_objet_rev_saisie:"+balise_objet_rev_saisie.valeur);
						}
					}
					// s'il y a deja une autre rev avec les memes rattachements, il faut creer une alternative a l'objet de cette revendication pre-existante
					else {
						typebalise = tagname_alternative;
						balise_objet_rev_saisie = BaliseObjetRevSaisie(autre_rev_meme_dependance.numero);
						// reduction de l'objet de la revendication dont on depend
					}
//					alert(texte_avec_references_objet.autour.length+'=='+balise_objet_rev_saisie.valeur.length)
					if (texte_avec_references_objet.autour.length < balise_objet_rev_saisie.valeur.length) {
						motif_objet = new RegExp(FormatRegex(texte_avec_references_objet.autour.toLowerCase()),'igm');
						res = motif_objet.exec(balise_objet_rev_saisie.valeur);
						if (res != null) {
							emplacement = motif_objet.lastIndex;
							chaine_trouvee = res[0];
							prequal = balise_objet_rev_saisie.valeur.substring(0, emplacement - chaine_trouvee.length); 
							postqual = balise_objet_rev_saisie.valeur.substring(emplacement+1);
							
							if (prequal.length+postqual.length > 0) {
								numero_rev_parente = NumeroRevendicationBaliseObjet(balise_objet_rev_saisie);
								ancien_idobjet = balise_objet_rev_saisie.idobjet;
								nouvel_idobjet = tagname_objet+' '+texte_avec_references_objet.autour.split(' ')[0]+'_'+numero_rev_parente;
								balise_objet_rev_saisie.idobjet = nouvel_idobjet;
								balise_objet_rev_saisie.valeur = texte_avec_references_objet.autour;
								balise_objet_rev_saisie.expression_recherchee = texte_avec_references_objet.autour;
								// il faut aussi changer l'idobjetconcerne des autres balises 
								for (var index = 0; index < balises.length; index++) {
									if (balises[index].idobjetconcerne == ancien_idobjet) {
										balises[index].idobjetconcerne = nouvel_idobjet;
									}
								}
								if (prequal.length > 0) {
									prequal_avec_references = AnalyseParentheses(prequal);
									CreeBalise(tagname_prequalificatif + ' ' + MotPrincipal(prequal) + '_' + numero_rev_parente, prequal_avec_references.autour, balise_objet_rev_saisie.idobjet, '', '', '', objet, mdr_global, prequal_avec_references.autour, '');
								}
								if (postqual.length > 0) {
									postqual_avec_references = AnalyseParentheses(postqual);
									CreeBalise(tagname_postqualificatif + ' ' + MotPrincipal(postqual) + '_' + numero_rev_parente, postqual_avec_references.autour, balise_objet_rev_saisie.idobjet, '', '', '', objet, mdr_global, postqual_avec_references.autour, '');
								}
							}
						}
					}
					idobjet = typebalise+' '+MotPrincipal(texte_avec_references.autour)+'_'+numero;
					CreeBalise(idobjet, texte_avec_references.autour, balise_objet_rev_saisie.idobjet, '', '',  '', objet, mdr_global, texte_avec_references.autour, '');

					// si participe present, cela signifie que c'est l'objet qui est caracterise, donc il ne faut pas mettre de caracteristique connue. En revanche, il faut mettre le verbe.
					// sinon, on met un espace comme caracteristique connue, pour la fabrication du texte de la revendication dans la description (fonction fabriquetexterevdesc)
					if (verbe.match(MotifParticipePresent())) {
						CreeBalise(tagname_verbe + ' ' + verbe + '_' + numero_rev_parente, verbe, idobjet, '', '', '', objet, mdr_global, verbe, '');
						connu = '';
					}
					else {
						verbe = '';
						connu = ' ';
					}

					if (inclure_references) {
						FabriqueObjetRevSaisie(numero, dependance, multidependance, rep.res[1].trim(), rep.genrenombre, connu, verbe, corps);
					}
					else {
						FabriqueObjetRevSaisie(numero, dependance, multidependance, AnalyseParentheses(rep.res[1].trim()).autour, rep.genrenombre, connu, verbe, AnalyseParentheses(corps).autour);
					}
					textesous = textesous.replace(patt_rev_html, "<span class='class_rev_dep_reconnue'>"+'$1'+".</span>");
					textesur = textesur.replace(patt_rev_html, "<span class='class_rev_dep_reconnue'>"+'$1'+".</span>");
				}
				else {
					idobjet = tagname_objet+' '+MotPrincipal(texte_avec_references_objet.autour)+'_'+numero;
					dependance = '';
					corps = rep.res[3].trim();
					verbe = rep.res[2].trim();
					CreeBalise(idobjet, texte_avec_references_objet.autour, '', '', rep.genrenombre, '', objet, mdr_global, texte_avec_references_objet.autour, '');
					texte_avec_references_option = AnalyseParentheses(corps);
					CreeBalise(tagname_nouveau+' '+MotPrincipal(texte_avec_references_option.autour)+'_'+numero, texte_avec_references_option.autour, idobjet, '', '', '', corps, mdr_global, texte_avec_references_option.autour, '');

					// si participe present, cela signifie que c'est l'objet qui est caracterise, donc il ne faut pas mettre de caracteristique connue. En revanche, il faut mettre le verbe.
					// pour une revendication independante, on ne met jamais de caracteristique connue.
					if (verbe.match(MotifParticipePresent())) {
						CreeBalise(tagname_verbe + ' ' + verbe + '_' + numero_rev_parente, verbe, numero, '', '', '', objet, mdr_global, verbe, '');
					}
					else {
						verbe = '';
					}
					connu = '';

					if (inclure_references) {
						FabriqueObjetRevSaisie(numero, dependance, false, objet, rep.genrenombre, connu, verbe, corps);
					}
					else {
						FabriqueObjetRevSaisie(numero, dependance, false, texte_avec_references_objet.autour, rep.genrenombre, connu, verbe, texte_avec_references_option.autour);
					}
					textesous = textesous.replace(patt_rev_html, "<span class='class_rev_indep_reconnue'>"+'$1'+".</span>");
					textesur = textesur.replace(patt_rev_html, "<span class='class_rev_indep_reconnue'>"+'$1'+".</span>");
				}
			}
		}
	}
	return '';
}

function Jointe(liste, separateur, dernier_separateur) {
	if (liste.length == 0) return '';
	if (liste.length == 1) return liste[0];
	texte = '';
	for (var index = 0; index < liste.length - 2; index++) {
		if (liste[index+1][0]==separateur) {
			le_separateur = '';
			l_espace = '';
		}
		else {
			le_separateur = separateur;
			l_espace = ' ';			
		}
		texte += liste[index] + le_separateur + l_espace;
	}
	texte += ((liste.length > 1) ? liste[liste.length - 2]:'');
	if (liste[liste.length - 1][0]==dernier_separateur) {
		le_separateur = '';
	}
	else {
		le_separateur = dernier_separateur;
	}
	texte += ((texte !== '') ? le_separateur + ' ':'') + liste[liste.length - 1];
	return texte;
}

function FabriqueObjet(texte) {
	if (texte) {
		try {
			var Objet = JSON.parse(texte);
			return Objet;
		}
		catch(err) {
			alert('Erreur sur : '+texte);
		}
	}
	return null;
}

// motif reference
//ex: 3 31a 435 A ABC 30A 3_a 33_A A44 A_6 piece_8 cadre4 ABC56 a2
// commence par une majuscule ou un chiffre, éventuellement suivi de _, puis de chiffres ou majuscules
// ou se termine par un chiffre
// (?:[\dA-Z])(?:_?)(?:[\dA-Z]*)|(?:.*\d+)

// enumeration references
// ex: "3, 4 et 5" ou "3, 4, 5" ou "3 4 et 5" ou "3"
// (?(?MR)(?(?,\s*|\s+(?et)?)*)+ où MR est motif reference

// extraction reference


// motif referencable (donc ni reference, ni mot interdit)
// ex: "objet", "élément", "Instrument", mais pas "figure" et ses variantes, ni "F56", ni"FGH"
// ne contient pas "figure" et ses variantes
// ne commence pas par un chiffre ou une majuscule
// si commence par des majuscules, celles-ci sont suivies d'autre chose que des chifres et des majuscules
// ne termine pas par un chiffre

function AnalyseDetails(details) {
	var motif_detail = '';
	var reponses = '';
	var tagsdep = [tagname_de, tagname_gn, tagname_continu];
	for (i=0; i<tagsdep.length; i++) {
		var motif_detail = tagsdep[i]+'='+MotifDetail();
		var patt = new RegExp(motif_detail, "i");
		var res = patt.exec(details);
		if (res!=null) {
			if (res!=details) {
				reponses += ((reponses=='') ? '':' ,') + '\"' + tagsdep[i] + '\" : \"' + res[1].trim() +  '\"' ;
			}
		}
	}
	reponses = '{' + reponses + '}';
	return FabriqueObjet(reponses);
}

function AnalyseBalise(chaine_balise) {
	if (chaine_balise=='') return null;
	var patt = new RegExp(MotifBaliseOuvrante(), "im");
	var baliseentiere = chaine_balise.replace(patt, '$1');
	baliseentiere = baliseentiere.replace(/\"/g,"'");

	var details = '';
	details = chaine_balise.replace(patt, '$5');
	if ((details!='') && (details!=chaine_balise)) {
		details = details.replace(/\"/g,"'");
	}

	var dico = chaine_balise.replace(patt, '{"baliseentiere":"'+baliseentiere+'", "idobjet":"$2", "typebalise":"$3", "nombalise":"$4", "details":"'+details+'"}');
	if (dico!='') {
		var ledico = FabriqueObjet(dico);
		if (tagnames_attendus.indexOf(ledico.typebalise)>-1) return ledico;
	}
	return null;
}

function AnalyseChaine(chaine_balise, texte) {
	var dico = '{"baliseouvrante":"", "reste":"'+chaine_balise+texte+'"}';
	var ledico = AnalyseBalise(chaine_balise);
	if (ledico!=null) {
		var chainebalisefermante = MotifBaliseFermante(ledico.typebalise);
		var expression = "(.*)("+chainebalisefermante+")(.*)";
		var patt = new RegExp(expression,'im');
		var res = patt.exec(texte);
		if ((res!=null) && (res[1]!='')) {
			var chaine = res[1];
			var reste = res[3];
			var avecetsansparentheses = AnalyseParentheses(chaine);
			if (ledico.typebalise==tagname_extraitrefs) {
				//alert("dans AnalyseChaine, skip AnalyseParentheses");
				avecetsansparentheses.entreparentheses = '';
			}
			if (ledico.details!='') {
				var les_details = AnalyseDetails(ledico.details);
				var cles = keys(les_details);
				if (cles.indexOf(tagname_de)>-1) var idobjetconcerne = les_details[tagname_de];
				else var idobjetconcerne = '';
				if (cles.indexOf(tagname_gn)>-1) var genrenombre = les_details[tagname_gn];
				else var genrenombre = '';
				if (cles.indexOf(tagname_continu)>-1) var continu = les_details[tagname_continu];
				else var continu = '';
			}
			else {
				var idobjetconcerne = '';
				var genrenombre = '';	
				var continu = '';		
			}
			var dico = '{"baliseouvrante":"'+ledico.baliseentiere+'", "idobjet":"'+ledico.idobjet+'", "typebalise":"'+ledico.typebalise+'", "nombalise":"'+ledico.nombalise+'", "details":"'+ledico.details+'", "idobjetconcerne":"'+idobjetconcerne+'", "genrenombre":"'+genrenombre+'", "continu":"'+continu+'", "texteinterne":"'+chaine+'", "sansparentheses":"'+avecetsansparentheses.autour+'", "entreparentheses":"'+avecetsansparentheses.entreparentheses+'", "expression_recherchee":"'+avecetsansparentheses.expression_recherchee+'", "expression_sans_parentheses":"'+avecetsansparentheses.expression_sans_parentheses+'", "balisefermante":"'+chainebalisefermante+'", "reste":"'+reste+'", "mdr":"'+mdr_global+'"}';
		}
	}
	return FabriqueObjet(dico);
}

function CreeBalise(idobjet, valeur, idobjetconcerne, references, genrenombre, continu, chaine, mdr, expression_recherchee, expression_sans_parentheses) {
	numero_balise += 1;
	reponse.push({idobjet:idobjet, valeur:valeur, idobjetconcerne:idobjetconcerne, references:references, genrenombre:genrenombre, continu:continu, chaine:chaine, expression_recherchee:expression_recherchee, numero_balise:numero_balise});
	var liste_references = ExtraitReferences(references);
	//alert("dans CreeBalise, liste_references: "+liste_references+" à partir de "+references);
	if (liste_references.length!=0) {
		numero_balise -= 1;
		CreeBalisesReferences(liste_references, expression_recherchee, idobjet, expression_sans_parentheses, mdr);
	}
 }

function AnalyseParentheses(texte) {
	var patt = new RegExp(MotifParentheses(), "im");
	if (texte=='') var reponse = '{"entreparentheses":"", "autour":"", "expression_recherchee":"", "expression_sans_parentheses":""}';
	else {
		var res = patt.exec(texte);
		if ((res!=null) && (res[0]!='')) {
			var avant = res[1].trim();// texte.replace(patt, '$1').trim();
			var entreparentheses = res[2].trim();// texte.replace(patt, '$2').trim();
			var apres = res[3].trim();// texte.replace(patt, '$3').trim();
			var autour = liaison(avant, apres);
			if (entreparentheses!='') var reponse = '{"entreparentheses":"'+entreparentheses+'", "autour":"'+autour+'", "expression_recherchee":"'+avant+ourien(' ', champ_joker_reference, '')+ourien(' ', apres, '')+'", "expression_sans_parentheses":"'+avant+ourien(' ', entreparentheses, '')+ourien(' ', apres, '')+'"}';
			else {
				// il y a des parentheses, mais vides
				var autour_minuscules = lowerizeFirstLetter(autour);
				var reponse = '{"entreparentheses":"", "autour":"'+autour_minuscules+'", "expression_recherchee":"'+avant+ourien(' ', champ_joker_reference, '')+ourien(' ', apres, '')+'", "expression_sans_parentheses":"'+autour_minuscules+'"}';
			}
		}
		else {
			var texte_minuscules = lowerizeFirstLetter(texte);
			var reponse = '{"entreparentheses":"", "autour":"'+SupprimeJoker(texte_minuscules)+'", "expression_recherchee":"'+texte_minuscules+'", "expression_sans_parentheses":"'+texte+'"}';
		}
	}
	var retour = FabriqueObjet(reponse);
	retour.autour = retour.autour.trim();
	// on regarde s'il y a encore des parentheses dans autour
	if (patt.exec(retour.autour)!=null) {
		var retour_rec = AnalyseParentheses(retour.autour);
		retour.entreparentheses += ','+retour_rec.entreparentheses;
		retour.autour = retour_rec.autour;
		retour.expression_recherchee = retour_rec.expression_recherchee;
		retour.expression_sans_parentheses = retour.expression_sans_parentheses;
	}
	return retour;
}

	if (ledico.baliseouvrante=='') {
		textesous += ToHTML(ledico.reste);
		textesur += ToHTML(ledico.reste);
	}
	else {
		if (ledico.typebalise==tagname_mdr) {
			CreeBalise(ledico.idobjet, ledico.texteinterne, ledico.idobjetconcerne, '', ledico.genrenombre, ledico.continu, ledico.texteinterne, mdr_global, '', '');
			ChercheRefs(ledico.texteinterne, ledico.idobjet);
	//		ChercheNoRefs(ledico.texteinterne, ledico.idobjet);
//			for (var j=0; j<balises_ref.length; j++) {
//				reponse.push({idobjet:balises_ref[j].idobjet, valeur:balises_ref[j].valeur, idobjetconcerne:balises_ref[j].idobjetconcerne, references:balises_ref[j].references, expressionreferencee:balises_ref[j].expressionreferencee, mdr:ledico.idobjet});
//				references_identifiees += ',' + balises_ref[j].references + ',';
//			}
			textesous += OuvreClasse(ledico.typebalise)+ToHTML(ledico.baliseouvrante)+BalisesetCouleursRefs(ledico.texteinterne, true)+ToHTML(ledico.balisefermante)+FermeClasse()+ToHTML(ledico.reste);
			textesur += OuvreA(ledico)+BalisesetCouleursRefs(ledico.texteinterne, false)+FermeA()+ToHTML(ledico.reste);
		}
		else {
			if (ledico.typebalise==tagname_extraitrefs) {
				ExtraitRefs(ledico.texteinterne, ledico.idobjet.split(' ')[1]);
			}

			textesous += OuvreClasse(ledico.typebalise)+ToHTML(ledico.baliseouvrante+ledico.texteinterne+ledico.balisefermante)+FermeClasse()+ToHTML(ledico.reste);
			textesur += OuvreA(ledico)+ToHTML(ledico.texteinterne)+FermeA()+ToHTML(ledico.reste);
			CreeBalise(ledico.idobjet, ledico.sansparentheses, ledico.idobjetconcerne, ledico.entreparentheses, ledico.genrenombre, ledico.continu, ledico.texteinterne, mdr_global, ledico.expression_recherchee, ledico.expression_sans_parentheses);
		}
	}
}

function BalisesetCouleursRefs(texte, garderbalises) {
	var reponse = texte;
	var chaine_balise_ref_ouvrante = MotifBaliseRefOuvrante()+'|'+'<'+tagname_noref+'>';
	var chaine_balise_ref_fermante = MotifBaliseRefFermante()+'|'+'</'+tagname_noref+'>';
//	if (garderbalises==true) {
//		texte = ToHTML(texte);
//		chaine_balise_ref_ouvrante = ToHTML(chaine_balise_ref_ouvrante);
//		chaine_balise_ref_fermante = ToHTML(chaine_balise_ref_fermante);
//		alert('conservation balises:\n'+chaine_balise_ref_ouvrante+'\n'+chaine_balise_ref_fermante+'\ndans :\n'+texte);
//	}
	var patt_ouvrante = new RegExp(chaine_balise_ref_ouvrante, 'igm');
	var patt_fermante = new RegExp(chaine_balise_ref_fermante, 'igm');
	var patts = [patt_ouvrante, patt_fermante];
	var remplacement = '';
	for (var j=0; j<2; j++) {
//		alert('test de match avec '+patts[j]+' dans \n'+texte);
		var res = texte.match(patts[j]);
//		alert('res:'+res);
		if (res!=null) {
			for (var i=0; i<res.length; i++) {
				if (garderbalises==true) remplacement = ToHTML(res[i]);
//				alert(' garder balise :'+(garderbalises==true)+' '+res[i]+' => '+remplacement);
//				alert(i+')'+res[i]);
				if (j==0) reponse = reponse.replace(new RegExp(res[i], 'igm'), FermeClasse()+OuvreClasse(tagname_ref)+remplacement);
				else reponse = reponse.replace(new RegExp(res[i], 'igm'), remplacement+FermeClasse()+OuvreClasse(tagname_mdr));
//				alert('reponse:'+reponse)
			}
		}
	}
	reponse = MiseEnRelief(reponse);
	return reponse;
}

function Traitement(texte) {
	var patt = new RegExp(MotifBaliseOuvrante(), "img");
	var debut = 0;
	var fin = 0;
	var res = patt.exec(texte);
	var texteinterne = '';
	var chaine_balise = '';
	var chaine_nouvelle_balise = '';
	var troncon = '';
	var reste = '';
	if (res!=null) {	
		while (res!=null) {
			fin = patt.lastIndex;
			chaine_nouvelle_balise = res[0];
			troncon = texte.substring(debut, fin - chaine_nouvelle_balise.length);
			var ledico = AnalyseChaine(chaine_balise, troncon);
			ExploiteDico(ledico);
			debut = fin;
			chaine_balise = chaine_nouvelle_balise;
			res = patt.exec(texte);
		}
		troncon = texte.substr(debut, texte.length - 1);
		var ledico =  AnalyseChaine(chaine_balise, troncon);
		ExploiteDico(ledico);
	}
}

function MiseEnRelief(texte) {
	var retour = texte;

function ExtraitReferences(la_chaine_reference) {
	if (la_chaine_reference=="") return [];
	var patt = new RegExp(MotifRangeNumRevsCapture(), 'im');
	var res = patt.exec(la_chaine_reference);
	var reponse = [];
	if (res!=null) {
		var debut = res[1];
		var fin = res[2];
		reponse = RangeBase(debut, fin);
	}
	else {
		var commande = "la_chaine_reference.split(/,|;|\\s"+conjonction_et+"\\s|\\s"+conjonction_ou+"\\s|\\s/)";
		var les_references = eval(commande);
		for (var j=0; j<les_references.length; j++) {
			var la_reference = ExtraitReference(" "+les_references[j]+" ");
			//alert("les references: "+la_chaine_reference+"=>"+les_references+"//"+les_references[j]+"//"+la_reference);
			if (la_reference!=null) reponse.push(la_reference);
		}
	}
	return reponse;
}

function ExtraitReference(lachaine) {
	if (lachaine=="") return null;
	var patt = new RegExp(MotifReference(), 'igm');
	var liste = patt.exec(lachaine);
	//alert("dans ExtraitReference: "+lachaine+"=>"+liste);
	if (liste!= null && liste.length > 1) return liste[1];
	else return null;
}

function MotifChaineRef() {
	return "([^0-9<]+)\\s+((?:[0-9,]"+TousChiffresEtLettres()+"*\\s{0,1})+)([^0-9<\\s]*[^0-9<]*)";
}

	return "\\({0,1}";

function MotifReference() {
// ((?:[\\dA-Z])(?:_?)(?:[\\dA-Z]*)|(?:.*\\d+))
//                                              >=2 maj puis (_)lettres OU >=1 chiffre puis (_)lettres OU lettres puis >=1 chiffres
	return ParentheseOuvranteOptionnelle()+"((?:[A-Z][A-Z]+)(?:_?)(?:[\\da-zA-Z]*(?:'*))|(?:[\\d]+)(?:_?)(?:[\\da-zA-Z]*(?:'*))|(?:[\\da-zA-Z]*\\d+(?:'*)))"+ParentheseFermanteOptionnelle();
	// return "("+
		ParentheseOuvranteOptionnelle()+
		// soit A, A9, AA9, A_2
		"("+TousChiffresEtLettresMajuscules()+ "+" +TousChiffresEt_()+"*"+
		"|"+
		// soit 42, 42A, 42b, 42_c
		TousChiffres()+ "+" +TousChiffresEtLettres()+"*"+
		"])"+
		ParentheseFermanteOptionnelle()
		+")";
}

function MotifReferencable() {
// ((?!([Ff][Ii][Gg][Ss]?\\.?|[Ff][Ii][Gg][Uu][Rr][Ee][Ss]?))(?:[a-z][a-zA-Z]*|[A-Z][a-z]*)(?!\\d)) suivi de (?:[\\s,]+) comme separateur
// (?!.*\\b[Ff]ig(?:s)?\\.?\\b.*)(?!.*\\b[Ff]igure(?:s)?\\b.*)
//	return "((?:"+"[a-z]"+"[a-zA-Z]"+"*|"+"[A-Z]"+"[a-z]"+"*)(?!\\d)(?:[\\s]+))";
	return "((?:"+ToutesLettresMinuscules()+ToutesLettres()+"*|"+ToutesLettresMajuscules()+ToutesLettresMinuscules()+"*)(?!\\d)(?:[\\s]+))";
}

	for (var i=0; i<balises_ref.length; i++) {
